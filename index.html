<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Job Posting</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 40px; padding: 20px;">

    <h1>Software Developer Position</h1>
    <p>Please review the job details and application preview below before applying:</p>

    <!-- Displays the application preview image on the main page -->
    <!-- Replace my-picture.jpg with the exact name of your uploaded image file -->
    <div style="margin: 20px 0;">
        <img src="my-picture.jpg" alt="Job Application Preview" style="max-width: 500px; width: 100%; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
    </div>

    <!-- Apply Button -->
    <a href="apply.html">
        <button style="padding: 14px 28px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer;">
            Apply Now
        </button>
    </a>

</body>
</html>
